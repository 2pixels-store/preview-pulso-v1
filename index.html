<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pulso — Medication Reminder</title>
<style>
/* ============ PULSO v1 — construido por Ziggy, fiel a los mockups ============ */
:root{
  --teal:#0e7c6f; --teal-2:#12a18d; --teal-deep:#0a5a52;
  --ink:#0b3b3f; --muted:#7a8f8c;
  --bg:#eaf4f0; --card:#ffffff; --card-bd:#e2ede9;
  --amber-bg:#fdf3e1; --amber:#b45309;
  --red:#c0392b; --red-bg:#fdeceb;
  --green:#1d9e6b; --green-bg:#e5f6ee;
  --pill:#dff0ea;
  --shadow:0 10px 30px rgba(11,59,63,.08);
  --hero:linear-gradient(135deg,#17b89f 0%,#0b7a6c 60%,#095e54 100%);
  --r:22px;
}
html.dark{
  --ink:#eef6f4; --muted:#8fa8a4;
  --bg:#06191d; --card:#0d272d; --card-bd:rgba(45,212,191,.14);
  --amber-bg:rgba(180,83,9,.16); --amber:#f5a623;
  --red:#f0716b; --red-bg:rgba(192,57,43,.14);
  --green:#34d399; --green-bg:rgba(29,158,107,.16);
  --pill:rgba(45,212,191,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"SF Pro Text",Inter,Roboto,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; justify-content:center;
  transition:background .3s,color .3s;
}
#phone{width:100%;max-width:430px;min-height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:500px){
  body{align-items:center;padding:24px}
  #phone{min-height:0;height:min(900px,94vh);border-radius:44px;overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.35);border:1px solid var(--card-bd)}
}
#view{flex:1;overflow-y:auto;padding:18px 18px 110px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* ---------- header ---------- */
.hd{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 2px 4px}
.hd h1{font-size:34px;font-weight:800;letter-spacing:-.5px}
.hd .sub{color:var(--muted);font-size:16px;margin-top:2px;text-transform:capitalize}
.hd .row{display:flex;gap:8px;align-items:center}
.langpill{border:0;cursor:pointer;background:var(--pill);color:var(--teal);font-weight:800;
  padding:10px 18px;border-radius:999px;font-size:15px}
html.dark .langpill{color:#5eead4}
.iconbtn{border:1px solid var(--card-bd);background:var(--card);color:var(--muted);cursor:pointer;
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.backbtn{display:flex;align-items:center;gap:6px;margin:6px 2px 10px}
.backbtn button{border:0;background:none;color:var(--muted);font-size:30px;cursor:pointer;line-height:1}
.backbtn h1{font-size:30px;font-weight:800}

/* ---------- section labels / cards ---------- */
.lbl{font-size:13px;font-weight:800;letter-spacing:1.2px;color:var(--muted);margin:20px 2px 10px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow)}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- profile chips ---------- */
.chips{display:flex;gap:10px;margin:4px 0 6px}
.chip{flex:1;border:1px solid var(--card-bd);background:var(--card);border-radius:18px;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  font-weight:700;font-size:14px;color:var(--ink)}
.chip .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.7)}
.chip.on{background:linear-gradient(160deg,#12a18d,#0a5f56);color:#fff;border-color:transparent}
.chip.on .av{border-color:rgba(255,255,255,.85)}

/* ---------- hero: próxima toma ---------- */
.hero{background:var(--hero);border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 16px 34px rgba(11,122,108,.35);margin-top:6px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.10);right:-70px;top:-70px}
.hero::before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.08);left:-40px;bottom:-50px}
.hero .k{font-size:12px;font-weight:800;letter-spacing:1.4px;opacity:.9;text-transform:uppercase}
.hero .n{font-size:32px;font-weight:800;margin:4px 0 2px}
.hero .d{font-size:16px;opacity:.92;margin-bottom:14px}
.hero button{position:relative;z-index:1;width:100%;border:0;cursor:pointer;background:#fff;color:#0a5a52;
  font-weight:800;font-size:17px;padding:15px;border-radius:999px}
.hero button:active{transform:scale(.98)}

/* ---------- alert banner ---------- */
.alert{background:var(--amber-bg);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.alert .ic{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800}
.alert.red{background:var(--red-bg)} .alert.red .ic{background:var(--red)}
.alert b{font-size:15px} .alert p{color:var(--muted);font-size:14px}

/* ---------- progress ---------- */
.prog{margin:16px 2px 4px;color:var(--muted);font-size:15px}
.progbar{height:10px;border-radius:99px;background:var(--pill);margin-top:8px;overflow:hidden}
.progbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal-2),var(--teal-deep));transition:width .4s}

/* ---------- dose rows ---------- */
.dose{background:var(--card);border:1px solid var(--card-bd);border-radius:20px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.dose .st{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.dose .st.todo{border:2px solid var(--card-bd)}
.dose .st.now{background:var(--pill);color:var(--teal)}
.dose .st.done{background:var(--green);color:#fff}
.dose .inf{flex:1;min-width:0}
.dose .inf b{font-size:17px;display:block}
.dose .inf span{color:var(--muted);font-size:14px}
.dose .tag{flex:none;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px}
.dose .tag.now{background:var(--pill);color:var(--teal);cursor:pointer;border:0}
.dose .tag.done{background:var(--green-bg);color:var(--green)}
.dose .tag.miss{background:var(--card-bd);color:var(--muted)}
.dose .stock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px;margin-top:6px}
.dose .stock i{width:12px;height:12px;border-radius:50%;background:currentColor;display:inline-block}
.stock.ok{background:var(--pill);color:var(--teal)}
.stock.warn{background:var(--amber-bg);color:var(--amber)}
.stock.crit{background:var(--red-bg);color:var(--red)}

/* ---------- tab bar ---------- */
#tabs{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--card-bd);
  display:flex;padding:10px 6px calc(14px + env(safe-area-inset-bottom));z-index:20}
#tabs button{flex:1;border:0;background:none;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
#tabs button svg{width:26px;height:26px}
#tabs button.on{color:var(--teal)} html.dark #tabs button.on{color:#5eead4}

/* ---------- forms ---------- */
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:800;font-size:16px;margin-bottom:8px}
.fld label small{color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--card);border:1px solid var(--card-bd);border-radius:16px;
  padding:15px 16px;font-size:16px;color:var(--ink);outline:none;box-shadow:var(--shadow)}
.inp:focus{border-color:var(--teal-2)}
.phprev{width:100%;max-height:230px;object-fit:cover;border-radius:14px;
  border:1px solid var(--card-bd);cursor:pointer;display:block}
.phthumb{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:none;border:1px solid var(--card-bd)}
.mrow{display:flex;gap:10px;margin-top:12px}
.fld .mrow .btn{flex:1;margin:0}
.days{display:flex;gap:8px}
.day{width:46px;height:46px;border-radius:50%;border:1px solid var(--card-bd);background:var(--card);
  font-weight:800;color:var(--muted);cursor:pointer;font-size:15px}
.day.on{background:var(--teal);border-color:var(--teal);color:#fff}
.times{display:flex;gap:8px;flex-wrap:wrap}
.tchip{background:var(--pill);color:var(--teal);font-weight:800;padding:12px 18px;border-radius:14px;
  display:flex;align-items:center;gap:8px;font-size:16px}
.tchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px}
.tadd{border:1px dashed var(--teal);background:none;color:var(--teal);font-weight:800;border-radius:14px;
  padding:12px 18px;cursor:pointer;font-size:15px}
.btn{display:block;width:100%;border:0;cursor:pointer;border-radius:999px;padding:17px;
  font-size:17px;font-weight:800;margin-top:10px}
.btn.pri{background:linear-gradient(160deg,#12a18d,#0a5f56);color:#fff;box-shadow:0 14px 28px rgba(11,122,108,.35)}
.btn.sec{background:var(--card);color:var(--teal);border:1px solid var(--card-bd)}
.btn.danger-o{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.btn:active{transform:scale(.985)}
.risk{color:var(--red);font-weight:800;font-size:16px;margin:22px 2px 8px}

/* ---------- history ---------- */
.week{display:flex;gap:8px;margin:6px 0 14px}
.wday{flex:1;background:var(--card);border:1px solid var(--card-bd);border-radius:16px;padding:8px 2px;
  text-align:center;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.wday b{display:block;font-size:17px;color:var(--ink)}
.wday .dt{width:8px;height:8px;border-radius:50%;background:var(--green);margin:6px auto 0}
.wday .dt.none{background:var(--card-bd)}
.wday.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.wday.sel b{color:#fff} .wday.sel .dt{background:#fff}
.adhbanner{background:var(--pill);border-radius:20px;padding:16px 18px;margin-bottom:6px}
.adhbanner .t{font-weight:800;font-size:16px}
.adhbanner .big{font-size:38px;font-weight:800;color:var(--teal)}
.adhbanner a{color:var(--teal);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}

/* ---------- report ---------- */
.disc{background:var(--amber-bg);border-radius:18px;padding:14px 18px;margin:6px 0 4px}
.disc b{font-size:15px;display:block}.disc span{color:var(--muted);font-size:14px}
.bigpct{font-size:52px;font-weight:800;color:var(--teal);line-height:1;margin:4px 0 12px}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-row .av{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;display:flex;
  align-items:center;justify-content:center;font-size:14px;flex:none}
.bar-row .nm{width:76px;font-weight:700;font-size:14px}
.bar-row .tr{flex:1;height:12px;border-radius:99px;background:var(--pill);overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.bar-row .pc{font-weight:800;width:48px;text-align:right}
.check{display:flex;align-items:center;gap:12px;margin:12px 2px;font-size:15px}
.check i{width:26px;height:26px;border-radius:50%;background:var(--pill);color:var(--teal);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-style:normal}
.offpills{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
.offpills span{background:var(--pill);color:var(--teal);font-weight:800;font-size:13px;
  letter-spacing:1px;padding:10px 20px;border-radius:999px}

/* ---------- settings ---------- */
.setrow{background:var(--card);border:1px solid var(--card-bd);border-radius:20px;padding:16px 18px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.setrow .t{font-weight:800;font-size:16px}.setrow .d{color:var(--muted);font-size:14px;margin-top:2px}
.setrow.danger{border:1.5px solid var(--red)} .setrow.danger .t{color:var(--red)}
.seg{display:flex;background:var(--pill);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;cursor:pointer;padding:10px;border-radius:999px;
  font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--teal);color:#fff}
.switch{width:58px;height:34px;border-radius:99px;background:var(--card-bd);border:0;cursor:pointer;position:relative;flex:none}
.switch::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:4px;left:4px;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch.on{background:var(--teal)} .switch.on::after{left:28px}

/* ---------- onboarding ---------- */
.ob{min-height:70dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px}
.ob .orb{width:110px;height:110px;margin:0 auto 26px;border-radius:38px;background:var(--hero);
  display:flex;align-items:center;justify-content:center;box-shadow:0 20px 44px rgba(11,122,108,.4)}
.ob h1{font-size:30px;font-weight:800;margin-bottom:10px}
.ob p{color:var(--muted);font-size:16px;margin-bottom:26px;line-height:1.5}
.ob .skip{margin-top:14px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;
  align-items:center;justify-content:center;padding:24px}
#modal .box{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:330px}
#modal h3{font-size:20px;margin-bottom:14px}
#modal .mrow{display:flex;gap:10px;margin-top:14px}

/* ---------- reminder banner ---------- */
#rembar{border-radius:18px;padding:14px 16px;margin:-6px -2px 14px;background:var(--hero);color:#fff;
  box-shadow:0 14px 30px rgba(11,122,108,.4);animation:rempulse 2.2s ease-in-out infinite}
#rembar b{font-size:16px} #rembar .mrow{display:flex;gap:10px;margin-top:12px}
#rembar button{flex:1;border:0;border-radius:999px;padding:13px;font-weight:800;cursor:pointer;font-size:15px}
#rembar .pri2{background:#fff;color:#0a5a52}
#rembar .sec2{background:rgba(255,255,255,.18);color:#fff}
@keyframes rempulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

/* ---------- print: reporte médico ---------- */
#print-doc{display:none}
@media print{
  body{display:block;background:#fff;padding:0}
  #phone,#tabs,#modal{display:none!important}
  #print-doc{display:block;color:#111;font-family:system-ui,sans-serif;padding:8px;max-width:700px;margin:0 auto}
  #print-doc h1{font-size:24px;margin-bottom:2px}
  #print-doc .sub{color:#555;font-size:13px;margin-bottom:14px}
  #print-doc table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0 18px}
  #print-doc th,#print-doc td{border:1px solid #bbb;padding:6px 8px;text-align:left}
  #print-doc th{background:#eee}
  #print-doc .disc-print{border:1px solid #999;border-radius:8px;padding:10px;font-size:12px;margin-top:14px;background:#fafafa}
}
</style>
</head>

<div id="print-doc"></div>

function seed(){
  const profiles=[
    {id:"p1",name:"Mom",color:PCOLORS[0]},
    {id:"p2",name:"Dad",color:PCOLORS[1]},
    {id:"p3",name:"Spouse",color:PCOLORS[2]},
    {id:"p4",name:"Me",color:PCOLORS[3]},
  ];
  const now=Date.now(), D=864e5;
  const meds=[
    {id:"m1",name:"Magnesium",qty:"1 capsule",notes:"with food",profileId:"p1",days:[1,1,1,1,1,1,1],times:["13:30"],pills:40,paused:false,archived:false,createdAt:now-40*D},
    {id:"m2",name:"Vitamin D3",qty:"1 capsule",notes:"",profileId:"p1",days:[1,1,1,1,1,0,0],times:["08:00"],pills:60,paused:false,archived:false,createdAt:now-40*D},
    {id:"m3",name:"Omeprazole",qty:"1 capsule",notes:"before breakfast",profileId:"p1",days:[1,1,1,1,1,1,1],times:["21:00"],pills:6,paused:false,archived:false,createdAt:now-40*D},
    {id:"m4",name:"Atorvastatin",qty:"1 tablet",notes:"",profileId:"p2",days:[1,1,1,1,1,1,1],times:["20:00"],pills:3,paused:false,archived:false,createdAt:now-20*D},
  ];
  // historial determinista de 30 días (~88% adherencia)
  const logs=[];let n=7;
  const rnd=()=>{n=(n*16807)%2147483647;return n/2147483647};
  for(let d=30;d>=1;d--){
    const day=addDays(new Date(),-d), key=todayKey(day), dow=(day.getDay()+6)%7;
    meds.forEach(m=>{
      if(m.createdAt>day.getTime()||!m.days[dow])return;
      m.times.forEach(tm=>{
        if(d===1){ // hoy: solo pasado
          const [h,mi]=tm.split(":").map(Number);
          if(h*60+mi >= day.getHours()*60+day.getMinutes()+new Date().getHours()*0+new Date().getMinutes()) {
            const nowM=new Date(); if(h*60+mi>nowM.getHours()*60+nowM.getMinutes()) return;
          }
        }
        const r=rnd();
        logs.push({id:uid()+d+tm,medId:m.id,profileId:m.profileId,day:key,time:tm,ts:day.getTime(),status:r<0.88?"taken":"missed"});
        if(r<0.88)m.pills=Math.max(0,m.pills-1);
      });
    });
  }
  return {lang:"en",theme:"dark",profiles,activeProfileId:"p1",meds,logs,
    notif:true,sound:true,onboardingDone:false,seq:100};
}

/* dosis de hoy para un medicamento */
function todayDoses(m,refDate){
  const d=refDate||new Date(), dow=(d.getDay()+6)%7;
  if(m.paused||m.archived||!m.days[dow])return[];
  const key=todayKey(d);
  return m.times.map(tm=>{
    const log=S.logs.find(l=>l.medId===m.id&&l.day===key&&l.time===tm);
    const mins=hm2min(tm), nowMin=d.getHours()*60+d.getMinutes();
    const isToday=key===todayKey(new Date());
    let state="todo";
    if(log)state=log.status==="taken"?"done":"miss";
    else if(isToday&&mins<=nowMin)state="now";
    return {med:m,time:tm,state,log};
  });
}
function allTodayDoses(){
  const out=[];S.meds.forEach(m=>{todayDoses(m).forEach(x=>out.push(x))});
  out.sort((a,b)=>hm2min(a.time)-hm2min(b.time));return out;
}
/* adherencia real: tomadas / esperadas en N días */
function adherence(days,profileId){
  const to=new Date(), from=addDays(to,-(days-1));
  let exp=0,tak=0;const missed={};
  for(let i=0;i<days;i++){
    const d=addDays(from,i), key=todayKey(d), dow=(d.getDay()+6)%7;
    const isFuture=key>todayKey(new Date());
    S.meds.forEach(m=>{
      if(m.archived||m.paused) { /* pausadas no cuentan */ }
      if(m.archived||m.createdAt>d.getTime()+864e5)return;
      if(profileId&&m.profileId!==profileId)return;
      if(!m.days[dow])return;
      m.times.forEach(tm=>{
        if(isFuture)return;
        if(key===todayKey(new Date())){
          const nowM=new Date();if(hm2min(tm)>nowM.getHours()*60+nowM.getMinutes())return;
        }
        exp++;
        const log=S.logs.find(l=>l.medId===m.id&&l.day===key&&l.time===tm);
        if(log&&log.status==="taken")tak++;
        else if(!log||log.status==="missed"){missed[m.id]=(missed[m.id]||0)+1}
      });
    });
  }
  return {pct:exp?Math.round(tak/exp*100):100,exp,tak,missed};
}

function doseRow(d){

  else{st=pillIcon(d.state==="now"?"now":"todo",d.state==="now"?svgPill:"");

function takeDose(medId,time){
  const m=med(medId);if(!m)return;
  const key=todayKey();
  S.logs=S.logs.filter(l=>!(l.medId===medId&&l.day===key&&l.time===time));
  S.logs.push({id:uid(),medId,profileId:m.profileId,day:key,time,ts:Date.now(),status:"taken"});
  if(m.pills>0)m.pills--;
  save();render();
}

/* ---------- recordatorio honesto: solo con la app abierta ----------
   Un HTML offline no puede disparar notificaciones push con la app cerrada.
   Esto muestra un aviso visual + tono suave cuando la hora de una toma llega
   MIENTRAS Pulso está abierto. Nunca promete alertas fuera de la app. */
function checkReminders(){
  if(!S.notif)return;
  const key=todayKey(), nowM=new Date().getHours()*60+new Date().getMinutes();
  S.reminded=S.reminded||{};
  if(S.remindedDay!==key){S.reminded={};S.remindedDay=key;save()}
  let changed=false;
  allTodayDoses().forEach(d=>{
    if(d.state!=="todo"&&d.state!=="now")return;
    const dm=hm2min(d.time);
    if(dm<=nowM&&nowM-dm<30){ // vencida hace menos de 30 min y sin marcar
      const rk=key+"|"+d.med.id+"|"+d.time;
      if(!S.reminded[rk]){S.reminded[rk]=1;changed=true;showReminder(d)}
    }
  });
  if(changed)save();
}
function showReminder(d){
  if(document.getElementById("rembar"))return;
  const bar=document.createElement("div");
  bar.id="rembar";
  bar.innerHTML=`<b>⏰ ${t("reminderT")}: ${esc(d.med.name)}</b>
   <div style="opacity:.92;margin-top:2px;font-size:14px">${esc(d.med.qty)} · ${fmtTime(d.time)} · ${esc(prof(d.med.profileId).name)}</div>
   <div class="mrow"><button class="pri2" onclick="takeDose('${d.med.id}','${d.time}')">${t("markTaken")}</button>
   <button class="sec2" onclick="hideReminder()">${t("later")}</button></div>`;
  const v=document.getElementById("view");
  v.insertBefore(bar,v.firstChild);
  if(S.sound){try{chime()}catch(e){}
    // vibrate solo con activación del usuario: sin ella Chromium lo bloquea con warning en consola
    try{if(navigator.userActivation&&navigator.userActivation.isActive&&navigator.vibrate)navigator.vibrate([150,80,150])}catch(e){}}
}
function hideReminder(){const b=document.getElementById("rembar");if(b)b.remove()}
function chime(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=new AC();
  [523.25,784].forEach((f,i)=>{
    const o=C.createOscillator(),g=C.createGain(),t0=C.currentTime+i*0.4;
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.3,t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.36);
    o.connect(g);g.connect(C.destination);
    o.start(t0);o.stop(t0+0.4);
  });
}

  renderTabs();
}
function photoField(kind,label){
  const v=FORM[kind];
  return `<div class="fld"><label>${label}</label>
   <input type="file" id="f-${kind}" accept="image/*" capture="environment" class="hidden" onchange="onPhoto('${kind}',this)">
   ${v?`<img src="${v}" class="phprev" onclick="document.getElementById('f-${kind}').click()">
   <div class="mrow"><button class="btn sec" style="margin:0" onclick="document.getElementById('f-${kind}').click()">${t("changePhoto")}</button>
   <button class="btn sec" style="margin:0" onclick="scrapeForm();FORM.${kind}=null;renderForm(!!FORM.id)">${t("removePhoto")}</button></div>`
   :`<button class="btn sec" onclick="document.getElementById('f-${kind}').click()">📷 ${t("takePhoto")}</button>`}</div>`;
}
function onPhoto(kind,input){
  const file=input.files&&input.files[0];if(!file)return;
  const img=new Image();
  img.onload=()=>{
    const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    scrapeForm();FORM[kind]=c.toDataURL("image/jpeg",0.72);
    URL.revokeObjectURL(img.src);renderForm(!!FORM.id);
  };
  img.onerror=()=>{URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(file);
}
function scrapeForm(){const n=document.getElementById("f-name");if(n){FORM.name=n.value;
  FORM.qty=document.getElementById("f-qty").value;FORM.pills=parseInt(document.getElementById("f-pills").value)||0}}
function fProfile(id){scrapeForm();FORM.profileId=id;renderForm(!!FORM.id)}
function fDay(i){scrapeForm();FORM.days[i]=FORM.days[i]?0:1;renderForm(!!FORM.id)}
function fTimeDel(i){scrapeForm();FORM.times.splice(i,1);renderForm(!!FORM.id)}
function fTimeAdd(){
  scrapeForm();
  openModal(`<h3>${t("times")}</h3>
    <input class="inp" id="np-time" type="time" value="08:00" style="text-align:center;font-size:20px">
    <div class="mrow"><button class="btn sec" style="margin:0" onclick="closeModal()">${t("cancel")}</button>
    <button class="btn pri" style="margin:0" onclick="saveTime()">${t("addMed")}</button></div>`);
}
function saveTime(){
  const v=document.getElementById("np-time").value;
  scrapeForm();closeModal();if(!v)return;
  const m=v.match(/^(\d{1,2}):(\d{2})$/);if(!m)return;
  FORM.times.push(`${String(m[1]).padStart(2,"0")}:${m[2]}`);FORM.times.sort();renderForm(!!FORM.id);
}
function fSave(id){
  const name=document.getElementById("f-name").value.trim();
  if(!name||!FORM.times.length){document.getElementById("f-name").focus();return}
  FORM.name=name;FORM.qty=document.getElementById("f-qty").value.trim()||"1";
  FORM.pills=Math.max(0,parseInt(document.getElementById("f-pills").value)||0);
  if(id){const m=med(id);Object.assign(m,FORM)}
  else{S.meds.push(Object.assign({id:uid(),createdAt:Date.now()},FORM))}
  save();go("meds");
}
function fPause(id){const m=med(id);m.paused=!m.paused;save();go("detalle",id)}
function fArchive(id){const m=med(id);m.archived=true;save();go("meds")}
function fDelete(id){if(confirm(t("confirmDel"))){S.meds=S.meds.filter(x=>x.id!==id);
  S.logs=S.logs.filter(l=>l.medId!==id);save();go("meds")}}

/* ---------- historial ---------- */
function vHist(){
  const sel=parseKey(SELDAY), monday=addDays(sel,-((sel.getDay()+6)%7));
  const dayKeys=["mon","tue","wed","thu","fri","sat","sun"];
  let week="";
  for(let i=0;i<7;i++){
    const d=addDays(monday,i),key=todayKey(d);
    const has=S.logs.some(l=>l.day===key);
    week+=`<button class="wday ${key===SELDAY?"sel":""}" onclick="SELDAY='${key}';render()">
      ${t(dayKeys[i])}<b>${d.getDate()}</b><div class="dt ${has?"":"none"}"></div></button>`;
  }
  const d=parseKey(SELDAY),dow=(d.getDay()+6)%7,key=SELDAY;
  const rows=[];
  S.meds.forEach(m=>{
    if(m.archived||!m.days[dow]||m.createdAt>d.getTime()+864e5)return;
    m.times.forEach(tm=>{
      if(key===todayKey(new Date())){const n=new Date();if(hm2min(tm)>n.getHours()*60+n.getMinutes())return}
      const log=S.logs.find(l=>l.medId===m.id&&l.day===key&&l.time===tm);
      const st=log?(log.status==="taken"?"done":"miss"):"miss";
      rows.push({m,tm,st});
    });
  });
  rows.sort((a,b)=>hm2min(a.tm)-hm2min(b.tm));
  const a30=adherence(30,null);
  view.innerHTML=header(t("history"),monthName(new Date())+" "+new Date().getFullYear())+
   `<div class="adhbanner"><div class="rowline"><div><div class="t">${t("histAdh")(monthName(new Date()))}</div>
     <div class="big">${a30.pct}%</div></div>
     <a onclick="go('reporte')">${t("viewReport")}</a></div></div>`+
   `<div class="week">${week}</div>
    <div class="lbl">${t("dayDetail")} — ${d.getDate()} ${monthName(d)}</div>`+
   (rows.length?rows.map(r=>{
     const tag=r.st==="done"?`<span class="tag done">${t("taken")}</span>`:`<span class="tag miss">${t("missed")}</span>`;
     const st=r.st==="done"?pillIcon("done",svgCheck):pillIcon("todo","–");
     return `<div class="dose">${st}<div class="inf"><b>${esc(r.m.name)}</b>
       <span>${esc(r.m.qty)} · ${fmtTime(r.tm)} · ${esc(prof(r.m.profileId).name)}</span></div>${tag}</div>`;
   }).join(""):`<p style="color:var(--muted)">${t("noRecords")}</p>`);
  renderTabs();
}

/* ---------- reporte ---------- */
function vReport(){
  const a30=adherence(30,null);
  const perProf=S.profiles.map(p=>{
    const a=adherence(30,p.id);return {p,pct:a.pct};
  });
  const missedRows=Object.entries(a30.missed)
    .map(([mid,n])=>({m:med(mid),n})).filter(x=>x.m&&x.n>0)
    .sort((a,b)=>b.n-a.n);
  view.innerHTML=backHeader(t("report"),`<button class="langpill" onclick="doPrint()">⤴ ${t("share")}</button>`)+
   `<div class="disc"><b>${t("disclaimerT")}</b><span>${t("disclaimerD")}</span></div>
    <div class="lbl">${t("adh30")}</div>
    <div class="card"><div style="color:var(--muted);font-weight:700">${t("householdAvg")}</div>
     <div class="bigpct">${a30.pct}%</div>`+
     perProf.map(({p,pct})=>`<div class="bar-row"><span class="av" style="background:${p.color}">${esc(p.name[0])}</span>
       <span class="nm">${esc(p.name)}</span><div class="tr"><i style="width:${pct}%"></i></div>
       <span class="pc" style="color:${pct<80?"var(--amber)":"var(--teal)"}">${pct}%</span></div>`).join("")+`</div>
    <div class="lbl">${t("missed30")}</div>`+
     (missedRows.map(({m,n})=>`<div class="card" style="margin-bottom:10px"><div class="rowline">
       <b>● ${esc(m.name)} (${esc(prof(m.profileId).name)})</b>
       <span style="color:var(--amber);font-weight:800">${t("missedN")(n)}</span></div></div>`).join("")||
      `<p style="color:var(--muted)">—</p>`)+
   `<div class="lbl">${t("printIncludes")}</div>
    <div class="check"><i>▬</i>${t("pi1")}</div>
    <div class="check"><i>▬</i>${t("pi2")}</div>
    <div class="check"><i>▬</i>${t("pi3")}</div>
    <button class="btn pri" onclick="doPrint()">${t("printBtn")}</button>
    <div class="offpills"><span>OFFLINE</span><span>${LANG==="es"?"PRIVADO":"PRIVATE"}</span></div>`;
  renderTabs();
}
function doPrint(){
  const doc=document.getElementById("print-doc");
  const a30=adherence(30,null);
  const rows=S.logs.filter(l=>l.day>=todayKey(addDays(new Date(),-29)))
    .sort((a,b)=>a.day<b.day?-1:1).map(l=>{
    const m=med(l.medId);if(!m)return"";
    return `<tr><td>${l.day}</td><td>${esc(prof(l.profileId).name)}</td><td>${esc(m.name)}</td>
      <td>${l.time}</td><td>${l.status==="taken"?t("stTaken"):t("stMissed")}</td></tr>`}).join("");
  const perMed=S.meds.filter(m=>!m.archived).map(m=>{
    let exp=0,tak=0;
    for(let i=0;i<30;i++){const d=addDays(new Date(),-i),key=todayKey(d),dow=(d.getDay()+6)%7;
      if(!m.days[dow]||m.createdAt>d.getTime()+864e5)continue;
      m.times.forEach(tm=>{exp++;const l=S.logs.find(x=>x.medId===m.id&&x.day===key&&x.time===tm);
        if(l&&l.status==="taken")tak++})}
    return `<tr><td>${esc(m.name)}</td><td>${esc(prof(m.profileId).name)}</td>
      <td>${exp?Math.round(tak/exp*100):100}%</td><td>${tak}/${exp}</td></tr>`}).join("");
  doc.innerHTML=`<h1>${t("printTitle")} — Pulso</h1>
    <div class="sub">${t("printGen")} · ${todayKey()} · ${t("householdAvg")}: ${a30.pct}%</div>
    <h3>${t("printTable")}</h3>
    <table><tr><th>${t("cDate")}</th><th>${t("cPerson")}</th><th>${t("cMed")}</th><th>${t("cTime")}</th><th>${t("cStatus")}</th></tr>${rows}</table>
    <h3>${t("printAdh")}</h3>
    <table><tr><th>${t("cMed")}</th><th>${t("cPerson")}</th><th>%</th><th>${t("cStatus")}</th></tr>${perMed}</table>
    <div class="disc-print"><b>${t("disclaimerT")}</b> ${t("disclaimerD")}</div>`;
  window.print();
}

/* ---------- ajustes ---------- */
function vAjustes(){
  view.innerHTML=backHeader(t("settings"))+
   `<div class="lbl">${t("household")}</div>
    <div class="card"><div class="chips" style="margin:0">`+
     S.profiles.map(p=>`<button class="chip ${p.id===S.activeProfileId?"on":""}" onclick="pickProfileA('${p.id}')">
       <span class="av" style="background:${p.color}">${esc(p.name[0])}</span>${esc(p.name)}</button>`).join("")+
     `<button class="chip" onclick="addProfile()"><span class="av" style="background:var(--pill);color:var(--teal)">+</span>${t("addProfile")}</button>`+
    `</div></div>
    <div class="lbl">${t("notif").toUpperCase()}</div>
    <div class="setrow"><div class="rowline"><div><div class="t">${t("notif")}</div><div class="d">${t("notifD")}</div></div>
     <button class="switch ${S.notif?"on":""}" onclick="S.notif=!S.notif;save();render()"></button></div></div>
    <p style="color:var(--muted);font-size:13px;margin:-4px 2px 12px;line-height:1.45">⚠️ ${t("notifNote")}</p>
    <div class="setrow"><div class="rowline"><div><div class="t">${t("sound")}</div><div class="d">${t("soundD")}</div></div>
     <button class="switch ${S.sound?"on":""}" onclick="S.sound=!S.sound;save();render()"></button></div></div>
    <div class="lbl">${t("lang")}</div>
    <div class="setrow"><div class="rowline"><div><div class="t">${t("lang")}</div><div class="d">Language</div></div>
     <div class="seg" style="min-width:190px"><button class="${LANG==="en"?"on":""}" onclick="setLang('en')">English</button>
     <button class="${LANG==="es"?"on":""}" onclick="setLang('es')">Español</button></div></div></div>
    <div class="setrow"><div class="rowline"><div><div class="t">${t("appearance")}</div></div>
     <div class="seg" style="min-width:170px"><button class="${!document.documentElement.classList.contains("dark")?"on":""}" onclick="setTheme(false)">${t("light")}</button>
     <button class="${document.documentElement.classList.contains("dark")?"on":""}" onclick="setTheme(true)">${t("dark")}</button></div></div></div>
    <div class="lbl">${t("privacy").toUpperCase()}</div>
    <div class="setrow"><div class="t">${t("privacyD")}</div>
     <div class="offpills" style="justify-content:flex-start"><span>100% OFFLINE</span><span>${LANG==="es"?"PRIVADO":"PRIVATE"}</span></div></div>
    <div class="lbl">${t("yourData").toUpperCase()}</div>
    <div class="setrow" onclick="exportData()" style="cursor:pointer"><div class="rowline"><div><div class="t">${t("export")}</div><div class="d">${t("exportD")}</div></div>
     <span style="color:var(--muted);font-size:22px">›</span></div></div>
    <div class="setrow danger" onclick="eraseAll()" style="cursor:pointer"><div class="t">${t("erase")}</div><div class="d">${t("eraseD")}</div></div>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-top:18px">${t("version")}</p>`;
  renderTabs();
}
function pickProfileA(id){S.activeProfileId=id;save();render()}
function addProfile(){
  openModal(`<h3>${t("newProfile")}</h3>
    <input class="inp" id="np-name" placeholder="${t("profileName")}" maxlength="20">
    <div class="mrow"><button class="btn sec" style="margin:0" onclick="closeModal()">${t("cancel")}</button>
    <button class="btn pri" style="margin:0" onclick="saveProfile()">${t("save")}</button></div>`);
  setTimeout(()=>document.getElementById("np-name").focus(),50);
}
function saveProfile(){
  const v=document.getElementById("np-name").value.trim();if(!v)return;
  const p={id:uid(),name:v,color:PCOLORS[S.profiles.length%PCOLORS.length]};
  S.profiles.push(p);S.activeProfileId=p.id;save();closeModal();render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="pulso-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function eraseAll(){if(confirm(t("confirmErase"))){localStorage.removeItem(KEY);location.reload()}}

/* ---------- modal / tabs / render ---------- */
function openModal(html){document.getElementById("modal-box").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function toggleLang(){setLang(LANG==="en"?"es":"en")}
function setLang(l){LANG=l;S.lang=l;save();document.documentElement.lang=l;render()}
function setTheme(dark){document.documentElement.classList.toggle("dark",dark);S.theme=dark?"dark":"light";save();render()}
function renderTabs(){
  const items=[["hoy",t("today"),svgClock],["meds",t("meds"),svgPill],["hist",t("history"),svgCal],["reporte",t("report"),svgDoc]];
  tabs.innerHTML=items.map(([r,l,ic])=>
    `<button class="${ROUTE.name===r?"on":""}" onclick="go('${r}')">${ic}<span>${l}</span></button>`).join("");
}
function render(){
  ({hoy:vHoy,meds:vMeds,detalle:()=>vDetalle(ROUTE.arg),nueva:()=>vForm(null),
    editar:()=>vForm(ROUTE.arg),hist:vHist,reporte:vReport,ajustes:vAjustes,
    onboarding:vOnboarding}[ROUTE.name]||vHoy)();
  checkReminders(); // aviso visual si alguna toma venció con la app abierta
}
function applyLangParam(){
  const q=new URLSearchParams(location.search);
  if(q.get("lang")==="es"||q.get("lang")==="en"){LANG=q.get("lang")}
  else if(S.lang)LANG=S.lang;
  document.documentElement.lang=LANG;
  document.documentElement.classList.toggle("dark",(S.theme||"dark")==="dark");
}
load();applyLangParam();
if(!S.onboardingDone)ROUTE={name:"onboarding"};else ROUTE={name:"hoy"};
render();
setInterval(checkReminders,30000); // chequeo de dosis próxima mientras la app está abierta
</script>
